name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Pull latest code on server
        run: |
          ssh -o StrictHostKeyChecking=no dscott@192.168.2.54 '
            cd /srv/chunky-web &&
            git fetch origin &&
            git checkout staging &&
            git reset --hard origin/staging
          '

      - name: Install dependencies
        run: |
          ssh dscott@192.168.2.54 '
            cd /srv/chunky-web &&
            npm ci --prefer-offline
          '

      - name: Build
        run: |
          ssh dscott@192.168.2.54 '
            cd /srv/chunky-web &&
            npm run build
          '

      - name: Restart service
        run: |
          ssh dscott@192.168.2.54 '
            sudo systemctl enable chunky-web &&
            sudo systemctl restart chunky-web
          '

      - name: Verify
        run: |
          sleep 5
          ssh dscott@192.168.2.54 'systemctl is-active chunky-web'
          curl -sf http://192.168.2.54/ -H "Host: dev.chunkywho.com" > /dev/null && echo "Site is up"

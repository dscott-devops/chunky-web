name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://w.chunkyapi.com

      - name: Deploy to server
        run: |
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/chunky-web-deploy -o StrictHostKeyChecking=no" \
            out/ \
            chunky-web@192.168.2.54:/var/www/chunkywho/

      - name: Verify
        run: |
          curl -sf http://192.168.2.54/ -H "Host: dev.chunkywho.com" > /dev/null && echo "Site is up"
